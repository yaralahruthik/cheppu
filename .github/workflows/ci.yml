name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build the app and run the core suite
    # Apple Silicon, matching the only hardware Cheppu supports.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        run: |
          swift --version
          xcode-select --print-path

      - name: Core is headless
        run: ./Scripts/check-core-is-headless.sh

      - name: The Engine Download is the only network path
        run: ./Scripts/check-the-download-is-the-only-network-path.sh

      - name: No audio reaches the disk
        run: ./Scripts/check-no-audio-reaches-the-disk.sh

      - name: The Hotkey never swallows a keystroke
        run: ./Scripts/check-the-hotkey-never-swallows-a-keystroke.sh

      - name: Cheppu types one keystroke
        run: ./Scripts/check-cheppu-types-one-keystroke.sh

      - name: Cheppu tells one key apart
        run: ./Scripts/check-cheppu-tells-one-key-apart.sh

      - name: The Pill never takes focus
        run: ./Scripts/check-the-pill-never-takes-focus.sh

      - name: Cleanup is a pure function
        run: ./Scripts/check-cleanup-is-a-pure-function.sh

      - name: History holds text only
        run: ./Scripts/check-history-holds-text-only.sh

      - name: Settings are one domain
        run: ./Scripts/check-settings-are-one-domain.sh

      - name: The log says nothing of what was said
        run: ./Scripts/check-the-log-says-nothing-of-what-was-said.sh

      # No Engine downloaded, no model, no microphone and nothing granted on
      # this runner: the suite has to be green all the same, which is the whole
      # point of the ports.
      - name: Core suite
        run: swift test

      - name: Build the app
        run: ./Scripts/make-app.sh

      - name: The app is a menu bar app
        run: test "$(plutil -extract LSUIElement raw dist/Cheppu.app/Contents/Info.plist)" = "true"

      # Without this, macOS refuses the request rather than asking, and the
      # first Dictation fails with no prompt the user could have said yes to.
      - name: The bundle says why it wants the Microphone
        run: test -n "$(plutil -extract NSMicrophoneUsageDescription raw dist/Cheppu.app/Contents/Info.plist)"

  accuracy:
    name: Word error rate on the committed fixtures
    # A job of its own rather than a step in the one above, so that a 480 MB
    # download and a model load never sit between a push and the answer to
    # "does it still build". Apple Silicon, which is the only hardware Cheppu
    # supports and the only hardware the ceiling was measured on: Parakeet on
    # CoreML is a different graph on a different chip, and a ceiling measured
    # on one says nothing about the other.
    runs-on: macos-15

    # The Engine is 480 MB over somebody else's network. A fetch that has stalled
    # should say so within the hour rather than sitting on a runner for six.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The Engine is the same 480 MB on every run, and the Engine Download is
      # the only network path Cheppu has. Caching it keeps this job about
      # accuracy rather than about bandwidth.
      - name: Restore the Engine
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Cheppu/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('Sources/CheppuEngine/EngineFiles.swift', 'Package.resolved') }}

      # Loads the real Parakeet, transcribes the committed audio of the
      # author's own voice, and fails if the measured rate has drifted past the
      # ceiling in Tests/CheppuAccuracyTests/AccuracyCeiling.swift.
      - name: Word error rate
        env:
          CHEPPU_ACCURACY: "1"
        run: |
          set -o pipefail
          swift test --filter CheppuAccuracyTests 2>&1 | tee measured.log

          # The measurement is off unless CHEPPU_ACCURACY is set, and a suite
          # that skipped is a suite that passed. Without this line, losing the
          # env block above would turn this job permanently green while
          # measuring nothing — which is the exact failure the whole ticket
          # exists to prevent, wearing a tick.
          grep -q "what the Engine heard, over" measured.log \
            || { echo "::error::the accuracy job ran but measured nothing"; exit 1; }
